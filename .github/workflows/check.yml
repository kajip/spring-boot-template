name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the dev container
        run: npx -y @devcontainers/cli@0.90.0 up --workspace-folder .
      - name: Run all checks
        run: npx -y @devcontainers/cli@0.90.0 exec --workspace-folder . ./gradlew --console=plain check
      - name: Smoke test the Docker image
        run: scripts/smoke-test.sh
